<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vera</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main>
      <header>
        <h1>Vera</h1>
        <p id="status" role="status">Connecting…</p>
      </header>

      <section id="transcript" aria-live="polite" aria-label="Transcript"></section>

      <p id="queued" role="status" aria-live="polite"></p>

      <form id="composer">
        <label for="prompt">Message</label>
        <textarea
          id="prompt"
          rows="4"
          placeholder="Ask Vera to inspect or change the project"
          disabled
        ></textarea>
        <div class="actions">
          <span>Enter to send · Shift+Enter for newline</span>
          <button id="stop" type="button" disabled>Stop</button>
          <button id="send" type="submit" disabled>Send</button>
        </div>
      </form>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
