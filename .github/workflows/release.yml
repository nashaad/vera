name: Release Vera
run-name: Release Vera v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version without the v prefix
        required: true
        type: string

concurrency:
  group: vera-release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.6"
  NPM_VERSION: "11.6.2"
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  build-package:
    name: Build npm package
    runs-on: ubuntu-24.04

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0

      - name: Validate release source
        run: |
          set -eu
          [ "$GITHUB_REF" = "refs/heads/main" ] || {
            echo "release workflow must be dispatched from main" >&2
            exit 1
          }
          printf '%s\n' "$RELEASE_VERSION" \
            | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          [ "$(git tag --points-at HEAD | grep -Fx "v$RELEASE_VERSION")" = "v$RELEASE_VERSION" ]
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "release tag is not reachable from origin/main" >&2
            exit 1
          }

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Pin npm
        run: |
          npm_prefix="$RUNNER_TEMP/npm-$NPM_VERSION"
          npm install --global --prefix "$npm_prefix" "npm@$NPM_VERSION"
          echo "$npm_prefix/bin" >> "$GITHUB_PATH"
          test "$("$npm_prefix/bin/npm" --version)" = "$NPM_VERSION"

      - name: Install development dependencies
        run: bun install --frozen-lockfile

      - name: Run package and installer tests
        run: bun test test/npm-package.test.ts test/install.test.ts

      - name: Build and validate npm tarball
        run: |
          scripts/build-npm-package.ts "$RELEASE_VERSION" dist
          scripts/validate-npm-package.ts \
            "dist/nashaad-vera-$RELEASE_VERSION.tgz" "$RELEASE_VERSION"

      - name: Upload npm tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vera-npm-package
          path: dist/nashaad-vera-*.tgz
          if-no-files-found: error

  platform-smoke:
    name: Smoke test npm package on ${{ matrix.platform }}/${{ matrix.arch }}
    needs: build-package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 1

      - name: Set up portable Bun for Linux x64
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-download-url: >-
            https://github.com/oven-sh/bun/releases/download/bun-v${{ env.BUN_VERSION }}/bun-linux-x64-baseline.zip

      - name: Set up Bun
        if: matrix.platform != 'linux' || matrix.arch != 'x64'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Pin npm
        run: |
          npm_prefix="$RUNNER_TEMP/npm-$NPM_VERSION"
          npm install --global --prefix "$npm_prefix" "npm@$NPM_VERSION"
          echo "$npm_prefix/bin" >> "$GITHUB_PATH"
          test "$("$npm_prefix/bin/npm" --version)" = "$NPM_VERSION"

      - name: Download npm tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vera-npm-package
          path: dist

      - name: Install exact npm tarball
        run: |
          vera_prefix="$RUNNER_TEMP/vera-install"
          npm install --global --ignore-scripts \
            --prefix "$vera_prefix" \
            --registry=https://registry.npmjs.org -- \
            "$GITHUB_WORKSPACE/dist/nashaad-vera-$RELEASE_VERSION.tgz"
          echo "$vera_prefix/bin" >> "$GITHUB_PATH"

      - name: Run CLI and native dependency smoke tests
        run: |
          test "$(env VERA_RELEASE_VERSION= vera --version)" = "vera $RELEASE_VERSION"
          vera --help | grep -q "Run one bounded turn"
          package_root="$RUNNER_TEMP/vera-install/lib/node_modules/@nashaad/vera"
          bun scripts/release-npm-native-smoke.ts "$package_root"

  container-smoke:
    name: Smoke test curl installer and faux model
    needs: build-package
    runs-on: ubuntu-24.04

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 1

      - name: Download npm tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vera-npm-package
          path: dist

      - name: Run npm installer container smoke test
        run: |
          scripts/release-npm-container-smoke.sh \
            "dist/nashaad-vera-$RELEASE_VERSION.tgz" "$RELEASE_VERSION"

  publish:
    name: Publish npm package
    needs: [build-package, platform-smoke, container-smoke]
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out protected release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/main
          fetch-depth: 1

      - name: Download verified npm tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vera-npm-package
          path: dist

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up npm registry authentication
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Pin npm
        run: |
          npm_prefix="$RUNNER_TEMP/npm-$NPM_VERSION"
          npm install --global --prefix "$npm_prefix" "npm@$NPM_VERSION"
          echo "$npm_prefix/bin" >> "$GITHUB_PATH"
          test "$("$npm_prefix/bin/npm" --version)" = "$NPM_VERSION"

      - name: Validate exact publish payload
        run: |
          scripts/validate-npm-package.ts \
            "dist/nashaad-vera-$RELEASE_VERSION.tgz" "$RELEASE_VERSION"

      - name: Check registry state and release monotonicity
        id: registry
        run: |
          scripts/check-npm-release.ts prepare \
            "dist/nashaad-vera-$RELEASE_VERSION.tgz" "$RELEASE_VERSION" \
            >> "$GITHUB_OUTPUT"

      - name: Publish verified npm package
        if: steps.registry.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event.repository.private }}" = "false" ]; then
            npm publish "$GITHUB_WORKSPACE/dist/nashaad-vera-$RELEASE_VERSION.tgz" \
              --registry=https://registry.npmjs.org \
              --access public --tag latest --provenance || true
          else
            npm publish "$GITHUB_WORKSPACE/dist/nashaad-vera-$RELEASE_VERSION.tgz" \
              --registry=https://registry.npmjs.org \
              --access public --tag latest || true
          fi

      - name: Verify registry bytes, latest tag, and provenance
        run: |
          if [ "${{ github.event.repository.private }}" = "false" ]; then
            scripts/check-npm-release.ts verify \
              "dist/nashaad-vera-$RELEASE_VERSION.tgz" "$RELEASE_VERSION" \
              --require-provenance
          else
            scripts/check-npm-release.ts verify \
              "dist/nashaad-vera-$RELEASE_VERSION.tgz" "$RELEASE_VERSION"
          fi
