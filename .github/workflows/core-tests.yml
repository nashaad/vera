name: Core tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: core-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.6"

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install development dependencies
        run: bun install --frozen-lockfile

      - name: Linux repro diagnostics
        run: bun dev/linux-repro.ts

      - name: Run the failing store test
        run: bun test test/store/session-store.test.ts -t "streamed open indexes UTF-8"
